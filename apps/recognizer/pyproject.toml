[project]
name = "recognizer"
version = "0.1.0"
description = "Riconoscimento self-hosted delle carte Pokémon: contorni, embedding e indice locale."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Modello e indice: servono al servizio e alla costruzione dell'indice, non ai test di geometria.
ml = [
  "torch>=2.4",
  "transformers>=4.45",
  "faiss-cpu>=1.8",
  "pillow>=10.4",
]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]
scripts = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recognizer*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: scarica il modello, escluso dalla CI"]
addopts = "-m 'not slow'"
